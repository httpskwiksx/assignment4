<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 2 - Bootstrap Form</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="CSS/style.css">
</head>
<body>

    <header>
        <nav class="task-navbar" aria-label="Main navigation">
            <a href="index.html">Task 0</a>
            <a href="task1.html">Task 1</a>
            <a href="task2.html">Task 2</a>
            <a href="task3.html">Task 3</a>
            <a href="task4.html">Task 4</a>
        </nav>
    </header>

    <main>
        <h1>Bootstrap Contact Form</h1>
        <p>Contact us using the form below.</p>

        <form class="bootstrap-form" action="#" method="get">

            <div class="row g-3">

                <div class="col-12 col-md-6">
                    <label for="name" class="form-label">Name:</label>
                    <input
                        type="text"
                        class="form-control"
                        id="name"
                        name="name"
                        placeholder="Enter your name"
                    >
                </div>

                <div class="col-12 col-md-6">
                    <label for="email" class="form-label">Email:</label>
                    <input
                        type="email"
                        class="form-control"
                        id="email"
                        name="email"
                        placeholder="example@gmail.com"
                    >
                    <div class="form-text">
                        We'll never share your email with anyone else.
                    </div>
                </div>

                <div class="col-12">
                    <label for="message" class="form-label">Message:</label>
                    <textarea
                        class="form-control"
                        id="message"
                        name="message"
                        rows="5"
                        placeholder="Write your message here..."
                    ></textarea>
                </div>

                <div class="col-12">
                    <button type="submit" class="btn btn-primary">
                        Submit
                    </button>
                </div>

            </div>

        </form>
    </main>

</body>
</html>
