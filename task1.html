<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 1 - HTML5 Validation</title>
    <link rel="stylesheet" href="CSS/style.css">
</head>
<body>

    <header>
        <nav class="task-navbar" aria-label="Main navigation">
            <a href="index.html">Task 0</a>
            <a href="task1.html">Task 1</a>
            <a href="task2.html">Task 2</a>
            <a href="task3.html">Task 3</a>
            <a href="task4.html">Task 4</a>
        </nav>
    </header>

    <main>
        <h1>HTML5 Validation</h1>
        <p>All fields are required. Please enter valid information.</p>

        <form action="#" method="get">

            <div class="form-group">
                <label for="name">Name:</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your name"
                    minlength="2"
                    maxlength="50"
                    required
                >
            </div>

            <div class="form-group">
                <label for="email">Email:</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="example@gmail.com"
                    maxlength="100"
                    required
                >
            </div>

            <div class="form-group">
                <label for="message">Message:</label>
                <textarea
                    id="message"
                    name="message"
                    rows="5"
                    placeholder="Write your message..."
                    minlength="10"
                    maxlength="500"
                    required
                ></textarea>
            </div>

            <button type="submit">Submit</button>

        </form>
    </main>

</body>
</html>
