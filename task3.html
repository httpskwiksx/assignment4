
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 3 - Bootstrap Validation</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="CSS/style.css">
</head>
<body>

    <header>
        <nav class="navbar" aria-label="Main navigation">
            <a href="index.html">Task 0</a>
            <a href="task1.html">Task 1</a>
            <a href="task2.html">Task 2</a>
            <a href="task3.html">Task 3</a>
            <a href="task4.html">Task 4</a>
        </nav>
    </header>

    <main>
        <h1>Bootstrap Validation</h1>
        <p>Fill out the form to see validation feedback.</p>

        <form id="contactForm" class="bootstrap-form" novalidate>

            <div class="row g-3">

                <div class="col-12 col-md-6">
                    <label for="name" class="form-label">Name:</label>
                    <input
                        type="text"
                        class="form-control"
                        id="name"
                        name="name"
                        placeholder="Enter your name"
                        minlength="2"
                        maxlength="50"
                        required
                    >
                    <div class="valid-feedback">Looks good!</div>
                    <div class="invalid-feedback">
                        Please enter at least 2 characters.
                    </div>
                </div>

                <div class="col-12 col-md-6">
                    <label for="email" class="form-label">Email:</label>
                    <input
                        type="email"
                        class="form-control"
                        id="email"
                        name="email"
                        placeholder="example@gmail.com"
                        required
                    >
                    <div class="valid-feedback">Valid email!</div>
                    <div class="invalid-feedback">
                        Please enter a valid email address.
                    </div>
                </div>

                <div class="col-12">
                    <label for="message" class="form-label">Message:</label>
                    <textarea
                        class="form-control"
                        id="message"
                        name="message"
                        rows="5"
                        placeholder="Write at least 10 characters..."
                        minlength="10"
                        maxlength="500"
                        required
                    ></textarea>
                    <div class="valid-feedback">Looks good!</div>
                    <div class="invalid-feedback">
                        Message must contain at least 10 characters.
                    </div>
                </div>

                <div class="col-12">
                    <button type="submit" class="btn btn-primary">
                        Submit
                    </button>
                </div>

                <div class="col-12">
                    <p id="formStatus" class="mb-0" role="status"></p>
                </div>

            </div>
        </form>
    </main>

    <script src="task3.js"></script>
</body>
</html>
